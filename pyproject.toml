[project]
name = "Pynal Destination"
version = "3.0.0"
description = "Record and retrace stops from long drives and commutes with private on-device location history."
requires-python = ">=3.12"
authors = [
    { name = "J.P Ancheta Javier", email = "qroize@gmail.com" }
]
dependencies = [
    "flet",
    "flet-geolocator"
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet]
product = "Pynal Destination"
org = "dev.flet"
company = "J.P Ancheta Javier"
copyright = "Copyright (C) 2026 by J.P Ancheta Javier"

# Android permissions required for background location tracking
[tool.flet.android.permission]
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
"android.permission.ACCESS_BACKGROUND_LOCATION" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_LOCATION" = true
"android.permission.WAKE_LOCK" = true

# (Optional) Build system – Flet uses setuptools by default
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"